
name: Terraform Infrastructure

# PR to main       -> Plan only
# Push to main     -> Plan -> Approval -> Apply
# Manual dispatch  -> Plan, Apply, or Destroy

on:
  push:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'

  pull_request:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

      confirm_destroy:
        description: 'Type destroy to confirm destruction'
        required: false
        default: ''

permissions:
  contents: read

env:
  TF_VERSION: '1.13.4'
  AWS_REGION: us-east-1

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------- PLAN ----------------

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    if: |
      !(github.event_name == 'workflow_dispatch' &&
        github.event.inputs.action == 'destroy')

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
          TF_VAR_github_org: ${{ vars.GH_ORG }}
        run: |
          terraform plan \
            -out=tfplan \
            -no-color

      - name: Upload plan file
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: envs/dev/tfplan
          retention-days: 1

  # ---------------- APPLY ----------------

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan

    if: |
      (github.ref == 'refs/heads/main' &&
       github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.action == 'apply')

    environment: dev

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Download plan file
        uses: actions/download-artifact@v7
        with:
          name: tfplan
          path: envs/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan

  # ---------------- DESTROY ----------------

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy'

    environment: dev

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
          TF_VAR_github_org: ${{ vars.GH_ORG }}
        run: terraform destroy -auto-approve -no-color
